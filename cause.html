    min-height: 100vh;
    background: linear-gradient(-45deg,#ffe6e6,#ffdbf4,#f1a5cb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow-x: hidden;
    padding: 2rem;
}

@keyframes gradientBG{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.container {
    max-width: 900px;
    margin: auto;
    text-align: center;
    position: relative; 
}

h1 {
    font-family: 'Bubblegum Sans', cursive;
    font-size: 3rem;
    color: #ff69b4;
    margin-bottom: 2rem;
}

.reason-card {
    opacity: 0;
    transform: translateY(50px) scale(0.9);
    background: #ffffff;
    border-radius: 20px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.reason-text {
    font-size: 1.1rem;
}

.shuffle-button {
    cursor: pointer;
    padding: 1rem 2rem;
    font-size: 1.2rem;
    border-radius: 50px;
    border: none;
    background: linear-gradient(45deg,#ff69b4,#ff99cc);
    color: white;
    margin-top: 1rem;
}

.floating {
    position: fixed;
    pointer-events: none;
    font-size: 20px;
    z-index: 999;
}
</style>
</head>

let currentReasonIndex = 0;
let reasonsContainer = document.getElementById('reasons-container');
let shuffleButton = document.querySelector('.shuffle-button');
let reasonCounter = document.querySelector('.reason-counter');
let isTransitioning = false;

// === FLOATING ELEMENTS ===
function createFloatingElement(){
    const elements = ['🌸','✨','💖','🦋','⭐'];
    const el = document.createElement('div');
    el.className='floating';
    el.textContent=elements[Math.floor(Math.random()*elements.length)];
    el.style.left=Math.random()*window.innerWidth+'px';
    el.style.top=Math.random()*window.innerHeight+'px';
    el.style.fontSize=(Math.random()*20+15)+'px';
    document.body.appendChild(el);
    gsap.to(el,{y:-500,duration:Math.random()*10+8,opacity:0,onComplete:()=>el.remove()});
}

// === DISPLAY 1 REASON PER CLICK ===
shuffleButton.addEventListener('click',()=>{
    if(isTransitioning) return;
    isTransitioning=true;

    if(currentReasonIndex<reasons.length){
        const reason = reasons[currentReasonIndex];
        const card = document.createElement('div');
        card.className='reason-card';
        const text = document.createElement('div');
        text.className='reason-text';
        text.innerHTML=`${reason.emoji} ${reason.text}`;
        card.appendChild(text);
        reasonsContainer.appendChild(card);

        // Animasi fade-in + slide + scale
        gsap.to(card,{opacity:1,y:0,scale:1,duration:0.8,ease:"back.out(1.7)"});

        reasonCounter.textContent=`Reason ${currentReasonIndex+1} of ${reasons.length}`;
        createFloatingElement();

        currentReasonIndex++;

        // transform button jika semua muncul
        if(currentReasonIndex===reasons.length){
            gsap.to(shuffleButton,{scale:1.1,duration:0.5,ease:"elastic.out",onComplete:()=>{
                shuffleButton.textContent="Enter Our Storylane 💫";
                shuffleButton.classList.add('story-mode');
                shuffleButton.addEventListener('click',()=>{
                    gsap.to('body',{opacity:0,duration:1,onComplete:()=>window.location.href='last.html'});
                });
            }});
        }

        setTimeout(()=>{isTransitioning=false;},800);
    }
});

// initial floating elements
setInterval(createFloatingElement,2500);

</script>
</body>
